<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 74" width="1280" height="74" role="img" aria-labelledby="hTitle hDesc">
  <title id="hTitle">02 // SYSTEM TELEMETRY</title>
  <desc id="hDesc">Ultron Rogue Core section header: LIVE SIGNAL // GITHUB GRAPH</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B11"/>
      <stop offset=".55" stop-color="#05070A"/>
      <stop offset="1" stop-color="#0B0507"/>
    </linearGradient>
    <linearGradient id="redRail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E10600"/>
      <stop offset=".72" stop-color="#7E0303"/>
      <stop offset="1" stop-color="#7E0303" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2A1A" stop-opacity="0"/>
      <stop offset=".45" stop-color="#FF2A1A" stop-opacity=".75"/>
      <stop offset="1" stop-color="#FF2A1A" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#17202A" stroke-width=".55" opacity=".55"/>
      <circle cx="0" cy="0" r=".7" fill="#26313D" opacity=".5"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cut">
      <path d="M14 6H1244L1274 36V68H36L6 38V14Z"/>
    </clipPath>
  </defs>
  <style>
    .flicker { animation: flick 6.4s steps(1) infinite; }
    .glitch { animation: slide 7.1s steps(1) infinite; }
    .scan { animation: sweep 5.2s linear infinite; }
    .pulse { animation: pulse 3.8s ease-in-out infinite; }
    @keyframes flick {
      0%, 9%, 12%, 47%, 49%, 100% { opacity: .52; }
      10%, 11% { opacity: .08; }
      48% { opacity: .22; }
    }
    @keyframes slide {
      0%, 91%, 100% { transform: translateX(0); opacity: .62; }
      92% { transform: translateX(4px); opacity: .95; }
      93% { transform: translateX(-3px); opacity: .4; }
      94% { transform: translateX(2px); opacity: .85; }
      95% { transform: translateX(0); opacity: .62; }
    }
    @keyframes sweep {
      0% { transform: translateX(-380px); opacity: 0; }
      12% { opacity: .75; }
      70% { opacity: .3; }
      100% { transform: translateX(1320px); opacity: 0; }
    }
    @keyframes pulse {
      0%, 100% { opacity: .45; }
      46% { opacity: 1; }
      54% { opacity: .72; }
    }
    @media (prefers-reduced-motion: reduce) {
      .flicker, .glitch, .scan, .pulse { animation: none !important; }
    }
  </style>

  <rect width="1280" height="74" fill="url(#panel)"/>
  <g clip-path="url(#cut)">
    <rect width="1280" height="74" fill="url(#grid)" opacity=".55"/>
    <rect class="scan" x="-380" y="0" width="380" height="74" fill="url(#scan)" opacity=".35"/>
    <rect x="0" y="0" width="1280" height="3" fill="#0B0E13" opacity=".8"/>
    <rect x="0" y="71" width="1280" height="3" fill="#0B0E13" opacity=".8"/>
  </g>

  <path d="M14 6H1244L1274 36V68H36L6 38V14Z" fill="none" stroke="#26303C"/>
  <path d="M6 38V14L14 6H48" fill="none" stroke="#7E0303" stroke-width="2"/>
  <path d="M1274 36V68H1232" fill="none" stroke="#7E0303" stroke-width="2"/>

  <g class="pulse">
    <rect x="24" y="25" width="4" height="28" fill="#E10600" filter="url(#glow)"/>
    <path d="M19 39L24 34L29 39L24 44Z" fill="#FF2A1A"/>
  </g>

  <text x="46" y="20" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="8" letter-spacing="2.6" fill="#B20A0A">SECTOR 02 // ROGUE CORE</text>
  <g class="glitch">
    <text x="47" y="51" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="29" font-weight="700" letter-spacing="2.4" fill="#C80808">02 // SYSTEM TELEMETRY</text>
  </g>
  <text x="44" y="48" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="29" font-weight="700" letter-spacing="2.4" fill="#E4EBF3">02 // SYSTEM TELEMETRY</text>

  <text x="1236" y="24" text-anchor="end" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="8" letter-spacing="2.4" fill="#A50A0A">ACCESS // GRANTED</text>
  <text x="1236" y="48" text-anchor="end" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="8" letter-spacing="2.2" fill="#5C6876">LIVE SIGNAL // GITHUB GRAPH</text>
  <g class="flicker" fill="#C80808">
    <rect x="1236" y="55" width="2" height="7"/>
    <rect x="1240" y="55" width="1" height="7"/>
    <rect x="1244" y="55" width="3" height="7"/>
    <rect x="1250" y="55" width="1" height="7"/>
  </g>

  <path d="M46 60H1236" stroke="#1E2731"/>
  <path d="M46 60H246" stroke="url(#redRail)" stroke-width="2"/>
  <g fill="#6D7A88">
    <rect x="272" y="58" width="2" height="4"/>
    <rect x="278" y="58" width="1" height="4"/>
    <rect x="283" y="58" width="4" height="4"/>
    <rect x="291" y="58" width="1" height="4"/>
  </g>
</svg>
