<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
  <title id="t">Ultron system telemetry — animated GitHub stats</title>
  <desc id="d">Live public GitHub stats for mohdziauddin2006-cloud: 154 contributions, 148 commits, 5 repositories, 1 stars and 2 followers.</desc>
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D131B"/>
      <stop offset=".52" stop-color="#080C11"/>
      <stop offset="1" stop-color="#04060A"/>
    </linearGradient>
    <radialGradient id="cardHalo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#C00606" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#780202" stop-opacity=".08"/>
