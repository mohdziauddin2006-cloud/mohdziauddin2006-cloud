      <rect x="0" width="2" height="12" fill="#6A7583"/>
      <rect x="5" width="1" height="12" fill="#6A7583"/>
      <rect x="8" width="3" height="12" fill="#6A7583"/>
      <rect x="14" width="1" height="12" fill="#6A7583"/>
